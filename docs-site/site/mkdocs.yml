# Intelligent Textbook: MkDocs Material configuration.
# Generated by the init-textbook skill. Customize as the book grows.
# Use the book-installer skill to add features incrementally
# (math, mascot, slides, learning graph viewer, etc.).

site_name: 'Mountainash Files'
site_description: 'Package documentation for mountainash-files: parse, inspect and write CSV, TSV, JSON, Parquet, Excel and XML files on local or remote storage through one API'
site_author: 'Nathaniel Ramm'
site_url: !ENV [TEXTBOOK_SITE_URL, 'https://docs.mountainash.io/mountainash-files/']

# Hooks: runs local Python before/after page processing
# social_override.py lets per-page `image:` frontmatter override the auto-
# generated social card URL for og:image and twitter:image meta tags.
hooks:
  - plugins/social_override.py

# Repository
repo_name: 'GitHub Repo'
repo_url: 'https://github.com/mountainash-io/mountainash-files'
edit_uri: !ENV [TEXTBOOK_EDIT_URI, 'edit/main/docs-site/site/docs/']

# Copyright
copyright: 'Copyright &copy; 2024-2026 Mountain Ash Solutions Pty. Ltd. Licensed under the <a href="https://www.apache.org/licenses/LICENSE-2.0">Apache License, Version 2.0</a>.'

# Navigation
# IMPORTANT: do NOT add `navigation.tabs`; these books use side navigation
# optimized for wide landscape screens.
nav:
  - Home: index.md
  - Why mountainash-files: why.md

  - Chapters:
      - List of chapters: chapters/index.md
      - 1. Files, specs and formats: chapters/files-specs-and-formats/index.md
      - 2. Reading and writing files: chapters/reading-and-writing/index.md
      - 3. Selecting files: chapters/selecting-files/index.md
      - 4. Format options: chapters/format-options/index.md
      - 5. Storage, profiles and transforms: chapters/storage-and-transforms/index.md
      - 6. Schema discovery: chapters/schema-discovery/index.md
      - 7. Write modes and Parquet append: chapters/write-modes/index.md
      - 8. Errors and troubleshooting: chapters/errors/index.md
      - 9. Custom formats and plugins: chapters/custom-formats/index.md
      - 10. How mountainash-files works: chapters/architecture/index.md
      - 11. Format engines and hardening: chapters/format-internals/index.md

  - FAQ: faq.md
  - Glossary: glossary.md

  - License: license.md
  - Contact: contact.md
  - About: about.md

# Theme configuration
theme:
  name: material
  # Once a logo is generated, point this at docs/img/logo.png or a mascot pose:
  # logo: img/logo.png
  # favicon: img/favicon.ico
  palette:
    primary: 'deep-orange'
    accent: 'amber'
  include_sidebar: true
  features:
    - content.code.copy
    - content.action.edit
    - navigation.expand
    - navigation.path
    - navigation.prune
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share

# Plugins
plugins:
  - search
  # Uncomment after running `pip install "mkdocs-material[imaging]"`:
  # - social
  # Uncomment after running `pip install mkdocs-glightbox`:
  # - glightbox:
  #     touchNavigation: true
  #     loop: false
  #     effect: zoom
  #     slide_effect: slide
  #     width: 100%
  #     height: auto
  #     zoomable: true
  #     draggable: true
  #     auto_caption: false
  #     caption_position: bottom
  #     skip_classes:
  #       - mascot-admonition-img   # keep mascot poses out of the lightbox gallery

# Markdown extensions
markdown_extensions:
  - md_in_html
  - admonition
  - attr_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.arithmatex:
      generic: true

# Custom CSS: file is created by init-textbook
extra_css:
  - css/extra.css

# Custom JavaScript: uncomment once a corresponding file exists
# extra_javascript:
#   - js/extra.js

# Exclude prompt scratch files and TODOs from build/search/sitemap
exclude_docs: |
  **/image-prompt*.md
  **/image-prompts*.md
  **/cover-prompt.md
  **/TODO.md

# Rebuild on changes during `mkdocs serve`
watch:
  - docs
  - mkdocs.yml

# Extra
extra:
  # Suppress the "Made with Material for MkDocs" footer line
  generator: false

  # MicroSim build-status indicators shown next to nav entries.
  # The status value is set per-page in the index.md frontmatter:
  #   status: scaffold | built | approved
  # Colors are defined as CSS custom properties in docs/css/extra.css.
  # Note: `theme.icon.status` is a Material Insiders feature and is silently
  # ignored on community Material. Do not add it; the CSS-variable approach
  # in extra.css is the load-bearing piece on the community edition.
  status:
    scaffold: 'Scaffold: placeholder, not yet implemented'
    built: 'Built: implementation complete, awaiting review'
    approved: 'Approved: tested and approved'

  # Intelligent-textbook URI scheme (see
  # https://dmccreary.github.io/intelligent-textbooks/uri-scheme/)
  schema: https://dmccreary.github.io/intelligent-textbooks/ns/textbook/v1
  textbook_name: 'Mountainash Files'
  textbook_version: '0.1'

  # Google Analytics: uncomment once a property ID exists:
  # analytics:
  #   provider: google
  #   property: G-XXXXXXXXXX
