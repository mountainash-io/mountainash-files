[metadata]
allow-direct-references = true

[version]
path = "src/mountainash_files/__version__.py"

[build.targets.wheel]
packages = ["src/mountainash_files"]

[build.targets.sdist]
include = ["/src", "/pyproject.toml", "/hatch.toml", "/README.md", "/LICENSE"]

#================
# Env: build_github
#================
[envs.build_github]
python = "3.12"
installer = "uv"
# Hatch installs the project before syncing environment dependencies.
pre-install-commands = ['uv pip install "{root}/temp/mountainash-settings" "{root}/temp/mountainash-secrets" "{root}/temp/mountainash-auth-client" "{root}/temp/mountainash-transport"']
dependencies = [
    "cyclonedx-bom==4.5.0",

    "mountainash_settings @    {root:uri}/temp/mountainash-settings",
    "mountainash_secrets @     {root:uri}/temp/mountainash-secrets",
    "mountainash_auth_client @ {root:uri}/temp/mountainash-auth-client",
    "mountainash_transport @   {root:uri}/temp/mountainash-transport",
]
[envs.build_github.scripts]
sbom-all = "cyclonedx-py environment > ./sbom-full.json"
sbom-direct = "cyclonedx-py requirements > ./sbom-direct.json"
export-requirements = "hatch dep show requirements > ./requirements.txt"

#================
# Env: default
#================
[envs.default]
python = "3.12"
installer = "uv"
path = ".venv"
# Hatch installs the project before syncing environment dependencies.
pre-install-commands = ['uv pip install "{root}/../mountainash-settings" "{root}/../mountainash-secrets" "{root}/../mountainash-auth-client" "{root}/../mountainash-transport"']
dependencies = [
    "mountainash_settings @    {root:uri}/../mountainash-settings",
    "mountainash_secrets @     {root:uri}/../mountainash-secrets",
    "mountainash_auth_client @ {root:uri}/../mountainash-auth-client",
    "mountainash_transport @   {root:uri}/../mountainash-transport",
]

#================
# Env: test_github
#================
[[envs.test_github.matrix]]
python = ["3.12"]

[envs.test_github]
installer = "uv"
path = ".hatch/test-github"
# Hatch installs the project before syncing environment dependencies.
pre-install-commands = ['uv pip install "{root}/temp/mountainash-settings" "{root}/temp/mountainash-secrets" "{root}/temp/mountainash-auth-client" "{root}/temp/mountainash-transport"']
dependencies = [
    "pytest==8.3.5",
    "pytest-check==2.5.3",
    "pytest-mock==3.12.0",
    "pytest-cov>=4.1.0",
    "pytest-clarity>=1.0.1",
    "openpyxl>=3.1",
    "fastexcel>=0.12",
    "lxml>=4.9",

    "mountainash_settings @    {root:uri}/temp/mountainash-settings",
    "mountainash_secrets @     {root:uri}/temp/mountainash-secrets",
    "mountainash_auth_client @ {root:uri}/temp/mountainash-auth-client",
    "mountainash_transport @   {root:uri}/temp/mountainash-transport",
    "mountainash @             {root:uri}/temp/mountainash",
    "mountainash_files @       {root:uri}",
]
[envs.test_github.scripts]
test = "pytest"
cov = "pytest --cov --junitxml=junit.xml -o junit_family=legacy --cov-report=xml"

#================
# Env: test
#================
[[envs.test.matrix]]
python = ["3.12"]

[envs.test]
installer = "uv"
# Hatch installs the project before syncing environment dependencies.
pre-install-commands = ['uv pip install "{root}/../mountainash-settings" "{root}/../mountainash-secrets" "{root}/../mountainash-auth-client" "{root}/../mountainash-transport"']
dependencies = [
    "pytest==8.3.5",
    "pytest-check==2.5.3",
    "pytest-mock==3.12.0",
    "pytest-cov>=4.1.0",
    "pytest-clarity>=1.0.1",
    "openpyxl>=3.1",
    "fastexcel>=0.12",
    "lxml>=4.9",
    "mountainash_settings @    {root:uri}/../mountainash-settings",
    "mountainash_secrets @     {root:uri}/../mountainash-secrets",
    "mountainash_auth_client @ {root:uri}/../mountainash-auth-client",
    "mountainash_transport @   {root:uri}/../mountainash-transport",
    "mountainash @             {root:uri}/../mountainash",
    "mountainash_files @       {root:uri}",
]
[envs.test.scripts]
test = "pytest"
cov = "pytest --cov --cov-report=term-missing"
[envs.ruff]
installer = "uv"
skip-install = true
dependencies = ["ruff==0.3.7"]
[envs.ruff.scripts]
check = "ruff check ./src"
fix = "ruff check ./src --fix"

[envs.mypy]
installer = "uv"
dependencies = ["mypy==1.10.1"]
[envs.mypy.scripts]
check = "mypy --install-types --non-interactive {args:src/mountainash_files tests}"
