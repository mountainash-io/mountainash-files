[metadata]
allow-direct-references = true

[version]
path = "src/mountainash_files/__version__.py"

[build.targets.wheel]
packages = ["src/mountainash_files"]

[envs.default]
installer = "uv"
path = ".venv"
dependencies = [
    "mountainash_transport @ {root:uri}/../mountainash-transport",
    "mountainash_settings @    {root:uri}/../mountainash-settings",
    "mountainash_auth_client @ {root:uri}/../mountainash-auth-client",
]

[[envs.test.matrix]]
python = ["3.12"]

[envs.test]
installer = "uv"
path = ".hatch/test"
dependencies = [
    "pytest==8.3.5",
    "pytest-check==2.5.3",
    "pytest-mock==3.12.0",
    "pytest-cov>=4.1.0",
    "pytest-clarity>=1.0.1",
    "openpyxl>=3.1",
    "fastexcel>=0.12",
    "lxml>=4.9",
    "mountainash_transport @ {root:uri}/../mountainash-transport",
    "mountainash_settings @    {root:uri}/../mountainash-settings",
    "mountainash_auth_client @ {root:uri}/../mountainash-auth-client",
]
[envs.test.scripts]
test = "pytest"
cov = "pytest --cov --cov-report=term-missing"

[envs.ruff]
installer = "uv"
detached = true
dependencies = ["ruff==0.3.7"]
[envs.ruff.scripts]
check = "ruff check ./src"
fix = "ruff check ./src --fix"

[envs.mypy]
installer = "uv"
path = ".hatch/mypy"
dependencies = ["mypy==1.10.1"]
[envs.mypy.scripts]
check = "mypy --install-types --non-interactive {args:src/mountainash_files tests}"

[envs.test_mountainash]
template = "test"
path = ".hatch/test-mountainash"
extra-dependencies = ["mountainash @ {root:uri}/../mountainash"]

[envs.test_mountainash.scripts]
test = "pytest tests_optional/mountainash {args}"

[envs.default.env-vars]
UV_CONSTRAINT = "{root}/requirements-hatch.txt"
HATCH_SIBLINGS = "{root:uri}/.."
